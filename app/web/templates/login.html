{% extends "base.html" %}
{% block title %}{{ t('auth_login_title', lang) }} — {{ brand }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <h1 class="text-2xl font-semibold mb-1">{{ t('auth_login_title', lang) }}</h1>

    {% if error %}
        <div class="mb-4 p-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-700">
            <div>{{ t('auth_invalid', lang) }}</div>
        </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
        <div>
            <label class="block text-sm text-slate-700 mb-1">{{ t('auth_email', lang) }}</label>
            <input type="email" name="email" required class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-ctablue" />
        </div>
        <div>
            <label class="block text-sm text-slate-700 mb-1">{{ t('auth_password', lang) }}</label>
            <input type="password" name="password" required class="w-full rounded-md border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-ctablue" />
        </div>
        <button type="submit" class="w-full px-4 py-2 rounded-md bg-ctablue text-white hover:bg-blue-700">
            {{ t('auth_submit', lang) }}
        </button>
    </form>
    <div class="mt-6 text-sm text-slate-600 text-center">
        <a href="/register" class="text-ctablue hover:underline">
            {{ t('auth_register', lang) }}
        </a>
    </div>
</div>
{% endblock %}
